
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365d">
<title>Leitor contínuo — AME</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:12px;background:#eaf5fc;
  color:#21445f;font-family:Arial,sans-serif
}
main{
  max-width:700px;margin:auto;background:#fff;
  border-radius:14px;padding:16px;
  box-shadow:0 4px 18px #10284617
}
header{
  background:linear-gradient(120deg,#176fa5,#168cc4,#37a9d9);
  color:white;padding:16px;border-radius:10px;margin-bottom:14px
}
h1{font-size:21px;margin:0 0 5px}
p{line-height:1.45;font-size:14px}
video{
  display:block;width:100%;max-height:55vh;
  object-fit:contain;background:#111;border-radius:10px
}
button{
  border:0;border-radius:8px;padding:13px 15px;
  font-weight:bold;font-size:15px;min-height:46px;
  cursor:pointer;margin:5px 2px
}
.primary{background:#176fa5;color:white}
.secondary{background:#e8eef5;color:#17365d}
button:disabled{opacity:.5}
.status{
  padding:12px;border-radius:8px;background:#e8f1fb;
  color:#194b7a;white-space:pre-wrap;margin:12px 0;
  font-size:13px;line-height:1.5
}
.status.error{background:#fdeaea;color:#a12626}
.status.ok{background:#e4f5eb;color:#176b48}
.result{
  padding:10px;background:#f7fbfe;border:1px solid #dce8f1;
  border-radius:8px;font-size:12px;white-space:pre-wrap;
  overflow-wrap:anywhere;margin-top:10px
}
canvas{display:none}
</style>
</head>

<body>
<main>

<header>
<h1>Leitura automática das etiquetas</h1>
<div>Controle de Oxigênio Medicinal — AME</div>
</header>

<p>
Aponte a câmera para a identificação individual do cilindro.
O sistema fará a leitura continuamente e procurará o cadastro correspondente.
</p>

<video id="video" autoplay playsinline muted></video>

<div id="status" class="status">
Aguardando autorização para acessar a câmera...
</div>

<div id="result" class="result">
Aguardando leitura da etiqueta.
</div>

<button id="startButton" class="primary" type="button">
Iniciar câmera
</button>

<button id="stopButton" class="secondary" type="button">
Fechar leitor
</button>

<canvas id="canvas"></canvas>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
'use strict';

const params = new URLSearchParams(location.search);

const nonce = params.get('nonce') || '';
const returnOrigin = params.get('returnOrigin') || '';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('result');

const startButton = document.getElementById('startButton');
const stopButton = document.getElementById('stopButton');

let stream = null;
let worker = null;
let active = false;
let busy = false;
let loopTimer = null;
let lastSent = '';
let lastSentAt = 0;

function status(message, type) {
  statusBox.textContent = message;
  statusBox.className = 'status ' + (type || '');
}

function sendParent(type, extra) {
  if (!window.opener || window.opener.closed) return;

  window.opener.postMessage({
    type: type,
    nonce: nonce,
    ...(extra || {})
  }, returnOrigin);
}

function normalizeText(text) {
  return String(text || '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
}

async function prepareWorker() {
  if (worker) return worker;

  if (!window.Tesseract) {
    throw new Error('Biblioteca OCR indisponível. Verifique a internet.');
  }

  status('Preparando o mecanismo de reconhecimento...');

  worker = await Tesseract.createWorker('eng', 1, {
    logger: info => {
      if (
        info &&
        info.status === 'recognizing text' &&
        typeof info.progress === 'number'
      ) {
        status(
          'Analisando a etiqueta... ' +
          Math.round(info.progress * 100) + '%'
        );
      }
    }
  });

  await worker.setParameters({
    tessedit_char_whitelist:
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789./_-:',
    tessedit_pageseg_mode: '6',
    preserve_interword_spaces: '1'
  });

  return worker;
}

async function startCamera() {
  if (active) return;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status(
      'Este navegador não disponibilizou acesso à câmera. ' +
      'Abra o leitor em uma página HTTPS compatível.',
      'error'
    );
    return;
  }

  try {
    startButton.disabled = true;

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    await prepareWorker();

    active = true;
    lastSent = '';
    lastSentAt = 0;

    status(
      'Câmera ativa. Mantenha a identificação individual enquadrada.'
    );

    recognitionLoop();

  } catch (error) {
    stopCamera();

    status(
      'Não foi possível iniciar a câmera: ' +
      (error.message || String(error)) +
      '. Verifique a permissão de câmera do navegador.',
      'error'
    );

  } finally {
    startButton.disabled = false;
  }
}

function captureFrame() {
  if (!video.videoWidth || !video.videoHeight) {
    return null;
  }

  const maxWidth = 1100;
  const scale = Math.min(1, maxWidth / video.videoWidth);

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  context.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  return canvas;
}

async function recognizeFrame() {
  if (!active || busy || !worker) return;

  const frame = captureFrame();
  if (!frame) return;

  busy = true;

  try {
    const result = await worker.recognize(frame);

    const text = String(
      result && result.data && result.data.text || ''
    ).trim();

    if (!text) {
      status(
        'Câmera ativa. Aguardando caracteres legíveis na etiqueta.'
      );
      return;
    }

    resultBox.textContent = 'Texto detectado:\n' + text;

    const normalized = normalizeText(text);
    const now = Date.now();

    if (
      normalized.length >= 4 &&
      (
        normalized !== lastSent ||
        now - lastSentAt > 5000
      )
    ) {
      lastSent = normalized;
      lastSentAt = now;

      status('Identificação detectada. Consultando o Cadastro Mestre...');

      sendParent('AME_OCR_TEXT', {
        text: text
      });
    }

  } catch (error) {
    status(
      'Erro durante a leitura: ' +
      (error.message || String(error)),
      'error'
    );

  } finally {
    busy = false;
  }
}

async function recognitionLoop() {
  while (active) {
    await recognizeFrame();

    if (!active) break;

    await new Promise(resolve => {
      loopTimer = setTimeout(resolve, 1400);
    });
  }
}

function stopCamera() {
  active = false;

  if (loopTimer) {
    clearTimeout(loopTimer);
    loopTimer = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

async function closeReader() {
  stopCamera();

  if (worker) {
    try {
      await worker.terminate();
    } catch (error) {}

    worker = null;
  }

  sendParent('AME_OCR_CLOSED');
  window.close();
}

startButton.addEventListener('click', startCamera);
stopButton.addEventListener('click', closeReader);

window.addEventListener('message', event => {
  if (event.origin !== returnOrigin) return;
  if (event.source !== window.opener) return;

  const data = event.data || {};

  if (String(data.nonce || '') !== nonce) return;

  if (data.type === 'AME_OCR_MATCHED') {
    status('Cilindro localizado. Encerrando a câmera...', 'ok');
    closeReader();

  } else if (data.type === 'AME_OCR_AMBIGUOUS') {
    status(
      'Mais de um cilindro correspondeu à leitura. ' +
      'Aproxime a etiqueta individual e mantenha-a firme.',
      'error'
    );

  } else if (data.type === 'AME_OCR_NO_MATCH') {
    status(
      'Texto ainda não localizado no Cadastro Mestre. ' +
      'Ajuste o enquadramento e aguarde uma nova leitura.'
    );
  }
});

window.addEventListener('pagehide', () => {
  stopCamera();
});

if (!nonce || !returnOrigin || !window.opener) {
  status(
    'Abra o leitor pelo botão da tela de Movimentação do AME.',
    'error'
  );
} else {
  status('Leitor preparado. Clique em Iniciar câmera.');
}
</script>

</body>
</html>

<body>
<main>

<?!= include('CabecalhoAME', {
  title: 'Leitura OCR da Etiqueta',
  subtitle: 'Identificação do Cilindro pela Leitura da Etiqueta'
}); ?>

<p>
Aponte a câmera para a identificação individual do cilindro.
O sistema fará a leitura continuamente e procurará o cadastro correspondente.
</p>

<div class="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div class="scan-guide" aria-hidden="true"><span>Enquadre a etiqueta dentro desta área</span></div>
</div>

<div id="status" class="status">
Aguardando autorização para acessar a câmera...
</div>

<div id="result" class="result">
Aguardando leitura da etiqueta.
</div>

<button id="startButton" class="primary" type="button">
Iniciar câmera
</button>

<button id="stopButton" class="secondary" type="button">
Fechar leitor
</button>

<canvas id="canvas"></canvas>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
'use strict';

const params = new URLSearchParams(location.search);

const nonce = params.get('nonce') || '';
const returnOrigin = params.get('returnOrigin') || '';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const statusBox = document.getElementById('status');
const resultBox = document.getElementById('result');

const startButton = document.getElementById('startButton');
const stopButton = document.getElementById('stopButton');

const embedded = window.parent !== window;

let stream = null;
let worker = null;
let barcodeDetector = null;
let active = false;
let busy = false;
let loopTimer = null;
let lastSent = '';
let lastSentAt = 0;

function status(message, type) {
  statusBox.textContent = message;
  statusBox.className = 'status ' + (type || '');
}

function sendParent(type, extra) {
  const payload = {
    type: type,
    nonce: nonce,
    ...(extra || {})
  };

  // Dentro de iframe: protocolo AME_OCR_TEXT + nonce.
  if (embedded) {
    window.parent.postMessage(payload, '*');
    return true;
  }

  // Janela separada: compatibilidade com a Movimentação publicada,
  // que aguarda OX2_OCR_TEXT (e não AME_OCR_TEXT).
  if (window.opener && !window.opener.closed &&
      returnOrigin.startsWith('https://')) {
    const outgoing = type === 'AME_OCR_TEXT'
      ? { ...payload, type: 'OX2_OCR_TEXT' }
      : payload;
    window.opener.postMessage(outgoing, returnOrigin);
    return true;
  }

  return false;
}

function normalizeText(text) {
  return String(text || '')
    .toUpperCase()
    .replace(/\s+/g, ' ')
    .trim();
}

async function prepareWorker() {
  if (worker) return worker;

  if (!window.Tesseract) {
    throw new Error('Biblioteca OCR indisponível. Verifique a internet.');
  }

  status('Preparando o mecanismo de reconhecimento...');

  worker = await Tesseract.createWorker('eng', 1, {
    logger: info => {
      if (
        info &&
        info.status === 'recognizing text' &&
        typeof info.progress === 'number'
      ) {
        status(
          'Analisando a etiqueta... ' +
          Math.round(info.progress * 100) + '%'
        );
      }
    }
  });

  await worker.setParameters({
    tessedit_char_whitelist:
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789./_-:',
    tessedit_pageseg_mode: '6',
    preserve_interword_spaces: '1',
    user_defined_dpi: '300'
  });

  return worker;
}

async function startCamera() {
  if (active) return;

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    status(
      'Este navegador não disponibilizou acesso à câmera. ' +
      'Abra o leitor em uma página HTTPS compatível.',
      'error'
    );
    return;
  }

  try {
    startButton.disabled = true;

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    await prepareWorker();

    if ('BarcodeDetector' in window) {
      try {
        const supported = await BarcodeDetector.getSupportedFormats();
        const preferred = [
          'code_128','code_39','ean_13','ean_8',
          'itf','qr_code','codabar','upc_a','upc_e'
        ];
        const formats = preferred.filter(format => supported.includes(format));
        if (formats.length) barcodeDetector = new BarcodeDetector({ formats });
      } catch (error) {
        barcodeDetector = null;
      }
    }

    active = true;
    lastSent = '';
    lastSentAt = 0;

    status(
      'Câmera ativa. Mantenha a identificação individual enquadrada.'
    );

    recognitionLoop();

  } catch (error) {
    stopCamera();

    status(
      'Não foi possível iniciar a câmera: ' +
      (error.message || String(error)) +
      '. Verifique a permissão de câmera do navegador.',
      'error'
    );

  } finally {
    startButton.disabled = false;
  }
}

function captureFrame() {
  if (!video.videoWidth || !video.videoHeight) {
    return null;
  }

  // Recorta uma área ampla ao redor do centro, onde a etiqueta costuma
  // ser posicionada, e amplia a imagem para facilitar a leitura dos dígitos.
  const sx = Math.round(video.videoWidth * 0.05);
  const sy = Math.round(video.videoHeight * 0.14);
  const sw = Math.round(video.videoWidth * 0.90);
  const sh = Math.round(video.videoHeight * 0.78);
  const scale = Math.min(2, 1700 / sw);

  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));

  const context = canvas.getContext('2d', {
    willReadFrequently: true
  });

  context.filter = 'grayscale(1) contrast(1.45) brightness(1.05)';
  context.drawImage(
    video,
    sx, sy, sw, sh,
    0, 0, canvas.width, canvas.height
  );
  context.filter = 'none';

  return canvas;
}

async function recognizeFrame() {
  if (!active || busy || !worker) return;

  const frame = captureFrame();
  if (!frame) return;

  busy = true;

  try {
    const result = await worker.recognize(frame);

    let text = String(
      result && result.data && result.data.text || ''
    ).trim();

    // Em navegadores compatíveis, tenta decodificar o código de barras
    // além de reconhecer os caracteres impressos.
    if (barcodeDetector) {
      try {
        const detected = await barcodeDetector.detect(frame);
        const values = detected
          .map(item => String(item.rawValue || '').trim())
          .filter(Boolean);
        if (values.length) text = [text, ...values].filter(Boolean).join('\n');
      } catch (error) {
        // A falha no decodificador não interrompe o OCR.
      }
    }

    if (!text) {
      status(
        'Câmera ativa. Aguardando caracteres legíveis na etiqueta.'
      );
      return;
    }

    resultBox.textContent = 'Texto detectado:\n' + text;

    const normalized = normalizeText(text);
    const now = Date.now();

    if (
      normalized.length >= 4 &&
      (
        normalized !== lastSent ||
        now - lastSentAt > 5000
      )
    ) {
      lastSent = normalized;
      lastSentAt = now;

      status('Texto reconhecido. Conferindo a identificação no Cadastro Mestre...');

      const sent = sendParent('AME_OCR_TEXT', { text: text });
      if (!sent) {
        status(
          'Leitura feita, mas não consegui devolver o resultado à Movimentação. ' +
          'Feche este leitor e abra novamente pelo botão “Ler Etiqueta”.',
          'error'
        );
      }
    }

  } catch (error) {
    status(
      'Erro durante a leitura: ' +
      (error.message || String(error)),
      'error'
    );

  } finally {
    busy = false;
  }
}

async function recognitionLoop() {
  while (active) {
    await recognizeFrame();

    if (!active) break;

    await new Promise(resolve => {
      loopTimer = setTimeout(resolve, 1400);
    });
  }
}

function stopCamera() {
  active = false;

  if (loopTimer) {
    clearTimeout(loopTimer);
    loopTimer = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}

async function closeReader() {
  stopCamera();

  if (worker) {
    try {
      await worker.terminate();
    } catch (error) {}

    worker = null;
  }

  sendParent('AME_OCR_CLOSED');
  status('Leitor encerrado. A câmera foi desligada.', 'ok');

  // window.close funciona em janela aberta por script, mas não fecha um iframe.
  if (!embedded) window.close();
}

startButton.addEventListener('click', startCamera);
stopButton.addEventListener('click', closeReader);

window.addEventListener('message', event => {
  const fromHost = embedded
    ? event.source === window.parent
    : event.source === window.opener && event.origin === returnOrigin;

  if (!fromHost) return;

  const data = event.data || {};
  if (data.nonce && String(data.nonce) !== nonce) return;

  const type = String(data.type || '');
  const feedback = type === 'AME_OCR_FEEDBACK' ? String(data.status || '') : '';

  if (type === 'AME_OCR_MATCHED' || type === 'OX2_OCR_MATCHED') {
    status('Cilindro localizado no Cadastro Mestre. Encerrando a câmera...', 'ok');
    closeReader();

  } else if (
    type === 'AME_OCR_AMBIGUOUS' ||
    type === 'OX2_OCR_AMBIGUOUS' ||
    feedback === 'ambiguous'
  ) {
    status(
      'A leitura encontrou mais de um cadastro possível. ' +
      'Aproxime a etiqueta e tente novamente. Nenhum cilindro foi selecionado.',
      'error'
    );

  } else if (
    type === 'AME_OCR_NO_MATCH' ||
    type === 'OX2_OCR_NO_MATCH' ||
    feedback === 'not_found'
  ) {
    status(
      'O texto foi reconhecido, mas não correspondeu a um identificador único ' +
      'do Cadastro Mestre. Confira se está enquadrando a identificação individual ' +
      'do cilindro, e não apenas o lote ou o código do produto.',
      'error'
    );
  }
});

window.addEventListener('pagehide', () => {
  stopCamera();
});

if (embedded) {
  if (!nonce) {
    status('Identificador de comunicação ausente. Feche e abra novamente pelo sistema AME.', 'error');
  } else {
    status('Leitor preparado. Clique em Iniciar câmera.');
  }
} else if (!nonce || !returnOrigin.startsWith('https://') || !window.opener) {
  status(
    'Abra o leitor pelo botão “Ler Etiqueta” da tela de Movimentação do AME.',
    'error'
  );
} else {
  status('Leitor preparado. Clique em Iniciar câmera.');
}
</script>

</body>
</html>
